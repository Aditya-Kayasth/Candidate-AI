{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate AI</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <button id="sidebarToggle" class="sidebar-toggle-btn">☰ Filters</button>

    <div class="container">
        <aside class="search-panel" id="searchPanel">
            <div class="brand">
                <h1>CANDIDATE<span class="highlight">.AI</span></h1>
                <p>Fast Resume Search</p>
            </div>

            <form id="searchForm">
                <div class="form-group">
                    <label>Skill / Role</label>
                    <input type="text" id="skill" placeholder="e.g. Java Developer" required>
                </div>

                <div class="form-group">
                    <label>Experience (Years)</label>
                    <input type="number" id="experience" placeholder="e.g. 3" min="0" max="30" required>
                </div>

                <button type="submit" id="searchBtn">SEARCH PROFILES</button>
            </form>
        </aside>

        <main class="results-area">
            <header>
                <div class="header-top">
                    <h2 id="resultCount">Ready to search</h2>
                </div>
                
                <div class="progress-container" id="progressContainer" style="display:none;">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                
                <div class="status-bar" id="statusBar">Waiting for input...</div>
            </header>

            <div id="resultsGrid" class="results-grid">
            </div>
        </main>
    </div>

    <script src="{% static 'script.js' %}"></script>
</body>
</html>
